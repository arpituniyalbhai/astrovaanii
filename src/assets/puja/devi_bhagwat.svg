<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg_laxmi" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#880e4f" />
      <stop offset="50%" stop-color="#ad1457" />
      <stop offset="100%" stop-color="#ff6f00" />
    </linearGradient>
    <radialGradient id="pink_glow" cx="50%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#ff80ab" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#880e4f" stop-opacity="0" />
    </radialGradient>
  </defs>
  <rect width="600" height="400" fill="url(#bg_laxmi)" />
  <circle cx="300" cy="170" r="140" fill="url(#pink_glow)" />

  <!-- Lotus Throne -->
  <g transform="translate(300, 240)">
    <path d="M0,20 C-60,-10 -120,10 -90,50 C-40,60 0,30 0,20 Z" fill="#f48fb1" />
    <path d="M0,20 C60,-10 120,10 90,50 C40,60 0,30 0,20 Z" fill="#f48fb1" />
    <path d="M0,10 C-40,-30 -80,-10 -60,30 C-20,40 0,20 0,10 Z" fill="#f06292" />
    <path d="M0,10 C40,-30 80,-10 60,30 C20,40 0,20 0,10 Z" fill="#f06292" />
    <path d="M0,0 C-30,-60 0,-80 0,0 Z" fill="#ff4081" />
  </g>
  
  <!-- Showering Gold Coins -->
  <g fill="#ffd54f" stroke="#ffb300" stroke-width="1">
    <circle cx="240" cy="180" r="9" />
    <circle cx="255" cy="210" r="10" />
    <circle cx="230" cy="235" r="8" />
    <circle cx="360" cy="180" r="9" />
    <circle cx="345" cy="210" r="10" />
    <circle cx="370" cy="235" r="8" />
    
    <circle cx="300" cy="110" r="12" fill="#ffe082" />
    <circle cx="280" cy="140" r="10" />
    <circle cx="320" cy="140" r="10" />
  </g>

  <!-- Glowing Diya Pair -->
  <path d="M140,290 Q160,290 170,305 Q130,315 110,300 Z" fill="#ff8f00" />
  <path d="M140,285 Q145,265 140,255 Q135,265 140,285 Z" fill="#fff59d" />
  
  <path d="M460,290 Q440,290 430,305 Q470,315 490,300 Z" fill="#ff8f00" />
  <path d="M460,285 Q465,265 460,255 Q455,265 460,285 Z" fill="#fff59d" />

  <!-- Text -->
  <text x="300" y="365" text-anchor="middle" fill="#ffe082" font-family="Georgia, serif" font-size="22" font-weight="bold" letter-spacing="2">MAHALAXMI PUJA</text>
</svg>