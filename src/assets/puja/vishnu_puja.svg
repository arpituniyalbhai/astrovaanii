<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg_satya" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a237e" />
      <stop offset="50%" stop-color="#283593" />
      <stop offset="100%" stop-color="#f57f17" />
    </linearGradient>
    <radialGradient id="vishnu_glow" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#fff59d" />
      <stop offset="100%" stop-color="#f57f17" stop-opacity="0" />
    </radialGradient>
  </defs>
  <rect width="600" height="400" fill="url(#bg_satya)" />
  <circle cx="300" cy="170" r="130" fill="url(#vishnu_glow)" />
  
  <!-- Sacred Shankh & Chakra Symbols -->
  <!-- Shankh (Conch) Left -->
  <g transform="translate(160, 140) scale(0.8)">
    <path d="M30,10 C50,-10 80,10 70,40 C60,70 30,80 10,50 C-10,20 10,20 30,10 Z" fill="#ffffff" stroke="#ffd54f" stroke-width="2" />
    <path d="M30,10 C40,25 50,45 40,65" fill="none" stroke="#e0e0e0" stroke-width="2" />
  </g>
  
  <!-- Sudarshan Chakra Right -->
  <g transform="translate(390, 140) scale(0.8)">
    <circle cx="40" cy="30" r="35" fill="none" stroke="#ffe082" stroke-width="4" />
    <circle cx="40" cy="30" r="10" fill="#ffe082" />
    <!-- Rays -->
    <path d="M40,-5 L40,65 M5,-5 L75,65 M-5,30 L85,30 M5,65 L75,-5" stroke="#ffe082" stroke-width="2" />
  </g>

  <!-- Lotus Flower Base -->
  <g transform="translate(300, 260)">
    <path d="M0,0 C-40,-30 -80,-10 -60,20 C-30,30 0,10 0,0 Z" fill="#f48fb1" />
    <path d="M0,0 C40,-30 80,-10 60,20 C30,30 0,10 0,0 Z" fill="#f48fb1" />
    <path d="M0,0 C-30,-50 0,-70 0,0 Z" fill="#f06292" />
    <path d="M-20,0 C-50,-40 -20,-60 0,0 Z" fill="#ec407a" />
    <path d="M20,0 C50,-40 20,-60 0,0 Z" fill="#ec407a" />
  </g>

  <!-- Sacred Banana Leaves Framing -->
  <path d="M60,320 C100,200 150,150 200,250 C140,280 80,310 60,320 Z" fill="#4caf50" opacity="0.8" />
  <path d="M540,320 C500,200 450,150 400,250 C460,280 520,310 540,320 Z" fill="#4caf50" opacity="0.8" />

  <!-- Text -->
  <text x="300" y="365" text-anchor="middle" fill="#fff8e1" font-family="Georgia, serif" font-size="22" font-weight="bold" letter-spacing="2">SHREE SATYANARAYAN PUJA</text>
</svg>