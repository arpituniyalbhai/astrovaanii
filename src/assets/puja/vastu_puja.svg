<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg_griha" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3e2723" />
      <stop offset="50%" stop-color="#5d4037" />
      <stop offset="100%" stop-color="#d84315" />
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#bg_griha)" />
  
  <!-- Arch Entrance / Doorway Frame -->
  <path d="M150,350 L150,140 Q300,60 450,140 L450,350" fill="none" stroke="#ffe082" stroke-width="8" />
  <path d="M165,350 L165,150 Q300,75 435,150 L435,350" fill="none" stroke="#ffd54f" stroke-width="2" stroke-dasharray="8,6" />
  
  <!-- Sacred Kalash in Center -->
  <g transform="translate(300, 230)">
    <!-- Mango Leaves -->
    <path d="M0,-40 C-30,-70 -50,-60 -30,-30 Z" fill="#4caf50" />
    <path d="M0,-40 C30,-70 50,-60 30,-30 Z" fill="#4caf50" />
    <path d="M0,-40 C0,-80 15,-80 0,-30 Z" fill="#66bb6a" />
    
    <!-- Coconut -->
    <circle cx="0" cy="-45" r="22" fill="#795548" stroke="#5d4037" stroke-width="2" />
    
    <!-- Brass Kalash Pot -->
    <path d="M-25,-20 L25,-20 L35,20 C40,50 -40,50 -35,20 Z" fill="#ffb300" stroke="#ffe082" stroke-width="3" />
    
    <!-- Swastik on Kalash -->
    <path d="M-8,10 L8,10 M0,2 L0,18 M-8,2 L-8,10 M8,10 L8,18 M0,2 L8,2 M-8,18 L0,18" stroke="#d84315" stroke-width="2.5" stroke-linecap="square" />
  </g>
  
  <!-- Toran / Garland Hanging -->
  <path d="M150,140 Q225,170 300,140 Q375,170 450,140" fill="none" stroke="#ff9800" stroke-width="4" />
  <!-- Marigold flowers hanging -->
  <circle cx="200" cy="155" r="8" fill="#ffc107" />
  <circle cx="250" cy="158" r="8" fill="#ff9800" />
  <circle cx="300" cy="140" r="10" fill="#e65100" />
  <circle cx="350" cy="158" r="8" fill="#ff9800" />
  <circle cx="400" cy="155" r="8" fill="#ffc107" />
  
  <!-- Text -->
  <text x="300" y="370" text-anchor="middle" fill="#ffe082" font-family="Georgia, serif" font-size="22" font-weight="bold" letter-spacing="2">GRIHA PRAVESH PUJA</text>
</svg>